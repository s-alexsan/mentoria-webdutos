<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <div class="frame">
        <h1>Agenda de contatos</h1>
        <div class="campo">
            <label for="nome">Nome</label>
            <input id="nome" type="text" class="input-padrao">
        </div>

        <div class="campo">
            <label for="endereco">Endereço</label>
            <input id="endereco" type="text" class="input-padrao">
        </div>

        <div class="campo">
            <label for="cidade">Cidade</label>
            <input id="cidade" type="text" class="input-padrao">
        </div>

        <div class="campo">
            <label for="telefone">Telefone</label>
            <input id="telefone" type="tel" class="input-padrao">
        </div>

        <div class="btn-cadastrar">
            <div class="rectangle-4"></div>
            <button class="text-wrapper-5">CADASTRAR</button>
        </div>
    </div>
</body>


</html>
