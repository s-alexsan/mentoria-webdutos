<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Agenda de contatos</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container agenda-container">
    <div class="topo">
      <h1>Agenda de contatos</h1>
      <a href="cadastro.html" class="btn-cadastrar">CADASTRAR</a>
    </div>

    <div class="tabela-wrapper">
      <table class="tabela">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Endereço</th>
            <th>Cidade</th>
            <th>Telefone</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <!-- Cada pessoa cadastrada será exibida aqui em uma linha completa. -->
          <!-- Os botões EDITAR e EXCLUIR serão adicionados futuramente por linha. -->
        </tbody>
      </table>
    </div>
  </main>

</body>

</html>
